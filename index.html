<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sagasse – Mulheres que transformaram a tecnologia</title>
  <meta name="description" content="Inspire-se com as pioneiras que moldaram o mundo digital.">
  <link rel="icon" type="image/png" href="./imgs/iconssagassemini.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <!-- Preloader só aparece na 1ª visita da sessão (volta à home não repete) -->
  <script>try{if(sessionStorage.getItem('sagassePre'))document.documentElement.classList.add('sem-pre')}catch(e){}</script>
</head>
<body class="pg-home">
  <!-- TÍTULO DO TOPO (style.css › [SG8]) -->
  <h1 class="titulo-home">Sagasse – conectando mulheres e ideias</h1>

  <!-- PRELOADER: círculo sobe de baixo até o centro e expande mostrando a Sagasse (style.css › [SG2]) -->
  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="pre-circulo"><img src="./imgsquiz/sagasseDormindo.png" alt=""></div>
  </div>

  <!-- HUB: botão grande da Sagasse + opções que flutuam ao redor quando ela acorda (style.css › [SG3] e [SG4]) -->
  <main class="hub" id="hub">
    <div class="orbita" aria-hidden="true"></div>

    <!-- OPÇÕES (antes ficavam na barra lateral). Para mudar a posição use --ux/--uy (-1 a 1) -->
    <ul class="opcoes" id="opcoes" aria-label="Menu principal">
      <li class="opt" style="--i:0;--ux:0;--uy:-1;--ring:var(--mint)">
        <div class="flut"><a class="anim sg-opt" href="./pagesHome/historias.html"><span class="sg-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5.5C4.5 4 8 4 12 6c4-2 7.5-2 10-.5V19c-2.5-1.5-6-1.5-10 .5-4-2-7.5-2-10-.5z"/><path d="M12 6v13.5"/></svg></span><span class="sg-rotulo">Histórias delas</span></a></div>
      </li>
      <li class="opt" style="--i:1;--ux:0.951;--uy:-0.309;--ring:var(--gold)">
        <div class="flut"><a class="anim sg-opt" href="./pagesHome/chat.html"><span class="sg-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.8 7L4 20.5 5.5 16A8 8 0 1 1 21 12z"/></svg></span><span class="sg-rotulo">Chat</span></a></div>
      </li>
      <li class="opt" style="--i:2;--ux:0.588;--uy:0.809;--ring:#c8b6ff">
        <div class="flut"><a class="anim sg-opt" href="./pagesHome/cursos.html"><span class="sg-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v6"/></svg></span><span class="sg-rotulo">Cursos</span></a></div>
      </li>
      <li class="opt" style="--i:3;--ux:-0.588;--uy:0.809;--ring:var(--mint)">
        <div class="flut"><a class="anim sg-opt" href="./pagesHome/quiz.html"><span class="sg-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><path d="M12 17h.01"/></svg></span><span class="sg-rotulo">Quiz</span></a></div>
      </li>
      <li class="opt" style="--i:4;--ux:-0.951;--uy:-0.309;--ring:var(--gold)">
        <div class="flut"><a class="anim sg-opt" href="#"><span class="sg-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="sg-rotulo">Configurações</span></a></div>
      </li>
    </ul>

    <!-- BOTÃO DA SAGASSE (dormindo → acordada ao clicar) -->
    <button class="anim sagasse-btn" id="sagasseBtn" type="button" aria-expanded="false" aria-controls="opcoes" aria-label="Acordar a Sagasse e abrir o menu">
      <span class="eco"></span><span class="eco"></span>
      <span class="respira">
        <span class="disco">
          <img class="img-dorme" src="./imgsquiz/sagasseDormindo.png" alt="Sagasse dormindo">
          <img class="img-acorda" src="./imgsquiz/sagasseRadiante.png" alt="Sagasse acordada">
        </span>
      </span>
    </button>
  </main>

  <!-- TUTORIAL (só na 1ª visita; texto dos passos em js/sagasse.js) -->
  <div class="tutorial" id="tutorial" role="dialog" aria-modal="true" aria-label="Tutorial da Sagasse" hidden>
    <div class="tut-card">
      <img class="tut-avatar" src="./imgsquiz/sagasseRadiante.png" alt="Sagasse">
      <div class="tut-fala">
        <p id="tutTexto"></p>
        <div class="tut-acoes">
          <button class="anim tut-pular" id="tutPular" type="button">Pular</button>
          <button class="anim tut-prox" id="tutProx" type="button">Próximo</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/script.js"></script>
  <script src="./js/sagasse.js"></script>
</body>
</html>
